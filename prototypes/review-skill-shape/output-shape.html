<!doctype html>
<!-- PROTOTYPE for 180-Reviewer- issue 13. Three shapes of the SAME lead review, switchable with
?variant=A|B|C, plus ?gate=on|off and ?phone=1. The deck and the review are INVENTED for shape
only: no client, no real figures. Throwaway. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review shape prototype</title>
<style>
  :root { --bg:#faf9f6; --card:#fff; --ink:#1f1f1c; --muted:#6b6a64; --line:#e4e2db;
          --green:#78B038; --high:#c0392b; --mod:#d68910; --min:#7f8c8d; --user:#efede6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif; }
  .banner { background:#fff4d6; border-bottom:1px solid #ecd9a0; padding:8px 16px; font-size:13px; text-align:center; }
  .stage { max-width:760px; margin:0 auto; padding:24px 16px 120px; }
  body.phone .stage { max-width:390px; }
  body.phone .chat { border:10px solid #222; border-radius:28px; padding:14px; background:var(--card); }
  .turn-user { background:var(--user); border-radius:14px; padding:10px 14px; margin:0 0 14px auto; max-width:85%; }
  .turn-ai { margin-bottom:18px; }
  .attach { display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:8px; padding:2px 8px; margin-bottom:6px; background:#fff; }
  h2 { font-size:17px; margin:20px 0 6px; }
  h3 { font-size:15px; margin:16px 0 4px; }
  blockquote { margin:4px 0; padding:2px 10px; border-left:3px solid var(--line); color:#3d3c38; }
  ol, ul { padding-left:22px; margin:6px 0; }
  li { margin:4px 0; }
  table { border-collapse:collapse; width:100%; font-size:14px; margin:6px 0; }
  th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top; }
  th { background:#f3f1ea; }
  .tablewrap { overflow-x:auto; }
  .sev { font-weight:600; white-space:nowrap; }
  .sev.High { color:var(--high); } .sev.Moderate { color:var(--mod); } .sev.Minor { color:var(--min); }
  .small { font-size:13px; color:var(--muted); }
  .qline { font-size:13px; color:#2e6b12; background:#eef6e6; border-radius:6px; padding:4px 8px; display:inline-block; }
  .gate-line { background:#f2f4fb; border-radius:8px; padding:6px 10px; font-size:14px; }
  /* variant C: artifact */
  .artifact { border:1px solid var(--line); border-radius:12px; background:var(--card); padding:16px; }
  .art-head { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .mainbox { border-left:4px solid var(--high); background:#fdf1ef; padding:10px 12px; border-radius:6px; }
  .walk { position:relative; margin:18px 0 6px; }
  .tiles { display:grid; grid-template-columns:repeat(18, 1fr); gap:3px; position:relative; z-index:1; }
  .tile { height:34px; border-radius:4px; background:#e8f2dc; border:1px solid #cfe3b8; font-size:11px; display:flex;
          align-items:flex-end; justify-content:center; cursor:pointer; padding-bottom:2px; }
  .tile.Minor { background:#eceff0; border-color:#c9d0d2; }
  .tile.Moderate { background:#fbe7c6; border-color:#efc27a; }
  .tile.High { background:#f6cdc7; border-color:#e08a7e; }
  .tile.sel { outline:2px solid var(--ink); }
  .sections { display:grid; grid-template-columns:repeat(18, 1fr); gap:3px; font-size:11px; color:var(--muted); margin-top:3px; }
  .sections div { border-top:2px solid var(--line); padding-top:2px; white-space:nowrap; overflow:hidden; }
  svg.arcs { position:absolute; left:0; top:-26px; width:100%; height:30px; overflow:visible; z-index:0; }
  .legend { font-size:12px; color:var(--muted); margin:4px 0 12px; }
  .fcard { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0; }
  .fcard.dim { opacity:.35; }
  .fcard summary { cursor:pointer; list-style:none; }
  .fcard summary::-webkit-details-marker { display:none; }
  .decide button { font-size:12px; border:1px solid var(--line); background:#fff; border-radius:6px; padding:2px 8px; margin-right:4px; cursor:pointer; }
  .decide button.on { background:var(--ink); color:#fff; }
  /* switcher */
  .switcher { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#111; color:#fff;
              border-radius:999px; padding:8px 14px; display:flex; gap:10px; align-items:center; font-size:13px;
              box-shadow:0 6px 24px rgba(0,0,0,.25); z-index:10; flex-wrap:wrap; justify-content:center; max-width:calc(100vw - 24px); }
  .switcher button { background:#333; color:#fff; border:0; border-radius:999px; padding:4px 10px; cursor:pointer; font-size:13px; }
  .switcher button.on { background:var(--green); color:#111; }
  .switcher .stat { color:#bbb; }
</style>
</head>
<body>
<div class="banner"><b>Prototype.</b> The deck and the review are <b>invented</b>, for shape only. Same content in all three variants; only the layout changes.</div>
<div class="stage"><div class="chat" id="chat"></div></div>
<div class="switcher" id="sw"></div>

<script>
// ---- the one invented review every variant renders --------------------------------------
const R = {
  deck: "foodbank-volunteer-app.pptx", slides: 18,
  sections: [[1,2,"Intro"],[3,6,"Situation"],[7,12,"Analysis"],[13,15,"Recommendation"],[16,18,"Appendix"]],
  quoteLine: "Quotes checked by script: 11 of 11 found on the cited slide.",
  main: { title: "The deck recommends the booking app but never says what it costs or who sets it up.",
          why: "The board is asked to approve a change it cannot price, and nobody is named to start it.",
          slides: "2, 14" },
  findings: [
    { t:"The recommendation has no cost, owner or first step", sev:"High", slides:[14,15],
      q:[["We recommend adopting a volunteer booking app.",14],["Next steps: explore options with the board",15]],
      why:"The board approves budget lines. Without a yearly cost and a named owner it cannot say yes, so the decision slides to the next meeting.",
      next:"Add who sets the app up, what it costs per year and the first step for next month.",
      ask:"Did the client give the team a budget ceiling?" },
    { t:"The summary promises a pilot that slide 15 never gives", sev:"Moderate", slides:[2,15], arc:[2,15],
      q:[["A three-month pilot will test the app with two shift teams.",2],["Next steps: explore options with the board",15]],
      why:"A board member who reads only the summary expects a pilot ready to run. The closing slide asks them to keep exploring instead.",
      next:"Make slide 15 deliver the pilot the summary describes, or bring the summary down to what the deck supports.",
      ask:"Is the pilot agreed with the client, or the team's own idea?" },
    { t:"Nobody can tell if 30% unfilled shifts is bad", sev:"Moderate", slides:[7],
      q:[["30% of shifts are unfilled at least once a month",7]],
      why:"The case for change rests on this number. Without last year's figure or a target, the board cannot tell a crisis from normal churn.",
      next:"Name what the 30% should be compared with: last year, a similar food bank, or the client's own target.",
      ask:"Does the client track a target fill rate?" },
    { t:"The adoption claim rests on 12 volunteers reached on WhatsApp", sev:"Minor", slides:[9,17],
      q:[["Most volunteers would use an app (9 of 12 surveyed)",9],["Survey sent to the volunteer WhatsApp group",17]],
      why:"Volunteers already on WhatsApp are the ones most likely to use an app. The ones the change could lose were not asked.",
      next:"Optional: say who the survey did not reach, next to the claim on slide 9.",
      ask:"How many volunteers are in the WhatsApp group?" },
    { t:"Analysis titles name topics, not conclusions", sev:"Minor", slides:[8,10],
      q:[["Volunteer demographics",8],["Current tools",10]],
      why:"A board member flipping through slides 7 to 12 learns the topics but not what the team found, so the argument only lives in the speaker's head.",
      next:"Optional: rewrite each analysis title as the finding it proves.",
      ask:"Will the team present this, or will it be read without them?" }
  ],
  works: [
    ["The interview synthesis is concrete", "Coordinators spend about 4 hours a week chasing replies", 6],
    ["The options are compared side by side", "Option comparison: WhatsApp, shared spreadsheet, booking app", 12]
  ],
  cant: "whether a booking app suits these volunteers (needs domain knowledge); the values in the slide 11 chart (image only); prices of the named apps (not in the deck)",
  gate: { ask: "Before I show you anything: in two or three lines, what do you think is the biggest problem with this deck?",
          answer: "Recommendation seems fine but I don't think they've costed it. The survey also feels thin.",
          line: "<b>Your read:</b> no costing, thin survey · <b>Mine:</b> no cost, owner or first step · <b>Overlap:</b> partly. You caught findings 1 and 4. The summary-versus-slide-15 gap (finding 2) is the one to look at." },
  stamp: "180dc-review-lead · 1017-PROTO01"
};

const P = new URLSearchParams(location.search);
const state = { variant: P.get("variant") || "A", gate: P.get("gate") === "on", phone: P.get("phone") === "1", decisions: {} };
const VARIANTS = { A:"Reply: list + details", B:"Reply: table first", C:"Artifact: deck walk" };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const sl = a => (a.length > 1 ? "slides " : "slide ") + a.join(", ");
const qs = f => f.q.map(([q,n]) => `<blockquote>"${esc(q)}" (slide ${n})</blockquote>`).join("");
const count = () => { const c = {High:0,Moderate:0,Minor:0}; R.findings.forEach(f => c[f.sev]++); return c; };

function mainIssue() {
  return `<h2 data-main>Main issue</h2>
  ${state.gate ? `<p class="gate-line">${R.gate.line}</p>` : ""}
  <p><b>${R.main.title}</b> ${R.main.why} Slides ${R.main.slides}.</p>`;
}
function footer() {
  return `<p><b>Couldn't judge:</b> ${R.cant}.</p>
  <p class="small"><i>AI review, no grade. You decide what to keep. ${R.stamp}</i></p>`;
}

// ---- A: the SKILL.md template, rendered as a chat reply ---------------------------------
function A() {
  return `<p class="qline">${R.quoteLine}</p>${mainIssue()}
  <h2>Findings</h2><ol>${R.findings.map(f =>
    `<li><b>${f.t}</b> · <span class="sev ${f.sev}">${f.sev}</span> · ${sl(f.slides)}<br>→ ${f.next}</li>`).join("")}</ol>
  <h2>Details</h2>${R.findings.map((f,i) => `<h3>${i+1}. ${f.t}</h3>${qs(f)}
    <p><b>Why it matters:</b> ${f.why}<br><b>Ask the team:</b> ${f.ask}</p>`).join("")}
  <h2>What works</h2><ul>${R.works.map(([t,q,n]) => `<li><b>${t}</b>: "${esc(q)}" (slide ${n})</li>`).join("")}</ul>
  ${footer()}`;
}

// ---- B: one table up top (the owner's slide · problem · severity · next step), evidence below
function B() {
  const c = count();
  return `<p class="qline">${R.quoteLine}</p>${mainIssue()}
  <div class="tablewrap"><table><tr><th>#</th><th>Slide</th><th>Problem</th><th>Impact</th><th>Next step</th></tr>
  ${R.findings.map((f,i) => `<tr><td>${i+1}</td><td>${f.slides.join(", ")}</td><td><b>${f.t}</b></td>
    <td class="sev ${f.sev}">${f.sev}</td><td>${f.next}</td></tr>`).join("")}</table></div>
  <p class="small">${c.High} high impact · ${c.Moderate} moderate · ${c.Minor} minor</p>
  <h2>The evidence</h2>${R.findings.map((f,i) => `<p><b>${i+1}.</b> ${f.q.map(([q,n]) => `"${esc(q)}" (slide ${n})`).join(" · ")}<br>
    <span class="small"><b>Why:</b> ${f.why} <b>Ask:</b> ${f.ask}</span></p>`).join("")}
  <p><b>What works:</b> ${R.works.map(([t,q,n]) => `${t.toLowerCase()} ("${esc(q)}", slide ${n})`).join("; ")}.</p>
  ${footer()}`;
}

// ---- C: the older golden shape, as an artifact Free can render --------------------------
function C() {
  const worst = {}; const rank = {Minor:1, Moderate:2, High:3};
  R.findings.forEach(f => f.slides.forEach(s => { if (!worst[s] || rank[f.sev] > rank[worst[s]]) worst[s] = f.sev; }));
  const tiles = Array.from({length:R.slides}, (_,i) => i+1).map(n =>
    `<div class="tile ${worst[n]||""} ${state.sel===n?"sel":""}" data-n="${n}" title="Slide ${n}">${n}</div>`).join("");
  const secs = R.sections.map(([a,b,name]) => `<div style="grid-column:${a} / ${b+1}">${name}</div>`).join("");
  const arcs = R.findings.filter(f => f.arc).map(f => {
    const x = n => ((n - 0.5) / R.slides * 100);
    const [a,b] = f.arc;
    return `<path d="M ${x(a)} 28 C ${x(a)} -4, ${x(b)} -4, ${x(b)} 28" fill="none" stroke="#d68910" stroke-width="0.6" stroke-dasharray="1.5 1" vector-effect="non-scaling-stroke" style="stroke-width:1.6px"/>`;
  }).join("");
  const cards = R.findings.map((f,i) => {
    const d = state.decisions[i];
    const dim = state.sel && !f.slides.includes(state.sel) ? "dim" : "";
    return `<details class="fcard ${dim}" ${i===0?"open":""}><summary><b>${i+1}. ${f.t}</b> · <span class="sev ${f.sev}">${f.sev}</span> · ${sl(f.slides)}<br>→ ${f.next}</summary>
      ${qs(f)}<p><b>Why it matters:</b> ${f.why}<br><b>Ask the team:</b> ${f.ask}</p>
      <div class="decide">${["keep","ask","cut"].map(k => `<button data-f="${i}" data-k="${k}" class="${d===k?"on":""}">${k}</button>`).join("")}</div></details>`;
  }).join("");
  const decided = Object.entries(state.decisions);
  return `<p class="small">Claude made an artifact:</p><div class="artifact">
    <div class="art-head">Lead review · ${R.deck} · ${R.quoteLine}</div>
    <div class="mainbox">${mainIssue().replace("<h2 data-main>Main issue</h2>", "<b data-main>MAIN ISSUE</b>")}</div>
    <div class="walk" style="margin-top:34px"><svg class="arcs" viewBox="0 0 100 30" preserveAspectRatio="none">${arcs}</svg>
      <div class="tiles">${tiles}</div><div class="sections">${secs}</div></div>
    <div class="legend">Each tile is a slide, coloured by its worst finding. Dashed arc: two slides that disagree. Tap a tile to filter.</div>
    ${cards}
    <p><b>What works:</b> ${R.works.map(([t,q,n]) => `${t.toLowerCase()} ("${esc(q)}", slide ${n})`).join("; ")}.</p>
    ${footer()}
    <p class="small">Your calls so far: ${decided.length ? decided.map(([i,k]) => `${+i+1} ${k}`).join(", ") : "none"} (in memory only)</p>
  </div>`;
}

function render() {
  document.body.classList.toggle("phone", state.phone);
  const user = `<div class="turn-user"><span class="attach">📎 ${R.deck}</span><br>Can you review this before I send it back to the team?</div>`;
  const gate = state.gate ? `<div class="turn-ai">${R.gate.ask}</div><div class="turn-user">${R.gate.answer}</div>` : "";
  const reply = { A, B, C }[state.variant]();
  document.getElementById("chat").innerHTML = user + gate + `<div class="turn-ai" id="reply">${reply}</div>`;
  // surface the state: length and how far in the main issue sits
  const rep = document.getElementById("reply");
  const words = rep.innerText.split(/\s+/).filter(Boolean).length;
  const main = rep.querySelector("[data-main]");
  const range = document.createRange(); range.setStart(rep, 0); range.setEndBefore(main);
  const before = range.toString().split(/\s+/).filter(Boolean).length;
  document.getElementById("sw").innerHTML =
    `<button id="prev">←</button><b>${state.variant}</b> ${VARIANTS[state.variant]}<button id="next">→</button>
     <button id="gate" class="${state.gate?"on":""}">gate ${state.gate?"on":"off"}</button>
     <button id="phone" class="${state.phone?"on":""}">phone</button>
     <span class="stat">${words} words · main issue at word ${before} (the real run: ~1,400 and ~250)</span>`;
  sw("prev", () => cycle(-1)); sw("next", () => cycle(1));
  sw("gate", () => { state.gate = !state.gate; push(); });
  sw("phone", () => { state.phone = !state.phone; push(); });
  document.querySelectorAll(".tile").forEach(t => t.onclick = () => { const n = +t.dataset.n; state.sel = state.sel === n ? null : n; render(); });
  document.querySelectorAll(".decide button").forEach(b => b.onclick = e => { e.preventDefault(); state.decisions[b.dataset.f] = b.dataset.k; render(); });
}
function sw(id, fn) { document.getElementById(id).onclick = fn; }
function cycle(d) { const k = Object.keys(VARIANTS); state.variant = k[(k.indexOf(state.variant) + d + k.length) % k.length]; state.sel = null; push(); }
function push() {
  const q = new URLSearchParams({ variant: state.variant, gate: state.gate ? "on" : "off" });
  if (state.phone) q.set("phone", "1");
  history.replaceState(null, "", "?" + q); render();
}
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1); if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
