<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("assets/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
      :root { --ink: #1D2124; --muted: #6B7075; --rule: #D9DBD6; --paper: #FFFFFF; --green: #78B038; --green-text: #4A7322; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
      #root { position: absolute; inset: 0; }
      .scene { position: absolute; inset: 0; background: var(--paper); padding: 72px 96px 44px; display: flex; flex-direction: column;
               opacity: 0; visibility: hidden; }
      .tag { font: 500 28px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .05em; color: var(--green-text); }
      h1 { font-weight: 600; font-size: 58px; line-height: 1.16; margin-top: 16px; max-width: 1700px; }
      .body { flex: 1; min-height: 0; margin-top: 30px; position: relative; }
      .chart svg { width: 100%; height: 100%; display: block; }
      .reasons { list-style: none; border-top: 3px solid var(--ink); }
      .reasons li { display: grid; grid-template-columns: 90px 1fr; border-bottom: 1px solid var(--rule); padding: 28px 0; font-size: 42px; line-height: 1.25; }
      .reasons li span { font: 500 32px "IBM Plex Mono", monospace; color: var(--green-text); padding-top: 6px; }
      .footnote { margin-top: 24px; font-size: 32px; color: var(--muted); }
      .rows { border-collapse: collapse; width: 100%; border-top: 3px solid var(--ink); }
      .rows th, .rows td { text-align: left; border-bottom: 1px solid var(--rule); padding: 22px 0; font-size: 40px; vertical-align: top; }
      .rows th { width: 420px; font: 500 28px "IBM Plex Mono", monospace; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 30px; }
      .data { border-collapse: collapse; font-size: 30px; }
      .data th, .data td { border-bottom: 1px solid var(--rule); padding: 6px 28px 6px 0; text-align: right; font-family: "IBM Plex Mono", monospace; }
      .data th { color: var(--muted); font-weight: 500; }
      .data td:first-child, .data th:first-child { text-align: left; }
      .method { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; }
      .method p { font-size: 36px; line-height: 1.35; margin-bottom: 22px; }
      .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--rule); padding-top: 14px; margin-top: 18px;
              font: 22px "IBM Plex Mono", monospace; color: var(--muted); }
      .foot img { height: 40px; }
      .branch-btn { position: absolute; right: 0; top: -6px; font: 500 26px "IBM Plex Mono", monospace; color: var(--green-text);
                    border: 2px solid var(--green-text); padding: 10px 18px; background: var(--paper); }
    </style>
  </head>
  <body>
    <script type="application/hyperframes-slideshow+json">
{{ISLAND}}
    </script>
{{SCENES}}
    <script>
{{TIMELINES}}
    </script>
  </body>
</html>
